<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call - Shiv</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .call-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .remote-video {
            flex: 1;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .remote-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .local-video {
            position: absolute;
            bottom: 100px;
            right: 20px;
            width: 200px;
            height: 150px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid white;
            z-index: 10;
            background: #333;
        }
        .local-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .call-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 20;
        }
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .control-btn:hover { transform: scale(1.1); }
        .btn-end-call { background: #dc3545; color: white; }
        .btn-end-call:hover { background: #c82333; }
        .btn-mic, .btn-video { background: #6c757d; color: white; }
        .btn-mic.muted, .btn-video.off { background: #dc3545; }
        .call-info {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 20;
        }
        .call-info h3 { margin: 0; font-size: 24px; }
        .call-info p { margin: 5px 0 0; color: #ccc; }
        .call-timer {
            position: absolute;
            top: 90px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 18px;
            color: #25D366;
            z-index: 20;
            display: none;
        }
        @media (max-width: 768px) {
            .local-video { width: 120px; height: 90px; bottom: 80px; }
            .control-btn { width: 50px; height: 50px; font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="call-container">
        <div class="remote-video">
            <video id="remoteVideo" autoplay playsinline></video>
            <div id="waitingMessage" class="call-info">
                <h3>Calling {{ receiver.username }}...</h3>
                <p>Waiting for answer</p>
            </div>
        </div>
        
        <div class="local-video">
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        
        <div class="call-timer" id="callTimer">00:00</div>
        
        <div class="call-controls">
            <button class="control-btn btn-mic" id="micBtn" title="Toggle Mic">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="control-btn btn-end-call" id="endCallBtn" title="End Call">
                <i class="fas fa-phone-slash"></i>
            </button>
            <button class="control-btn btn-video" id="videoBtn" title="Toggle Video">
                <i class="fas fa-video"></i>
            </button>
        </div>
    </div>
    
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const callType = urlParams.get('type') || 'video';
        // FIX: call_id is now safely passed from server via Jinja2
        const callId = {{ call_id }};
        const receiverId = {{ receiver.id }};
        
        let localStream = null;
        let peerConnection = null;
        let callStartTime = null;
        let callDuration = 0;
        let timerInterval = null;
        
        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };
        
        // Get local media
        async function getLocalMedia() {
            const constraints = {
                audio: true,
                video: callType === 'video'
            };
            try {
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('localVideo').srcObject = localStream;
                return localStream;
            } catch (error) {
                console.error('Error accessing media devices:', error);
                alert('Cannot access camera/microphone. Please check permissions.');
                return null;
            }
        }
        
        // Start call timer
        function startTimer() {
            const timerEl = document.getElementById('callTimer');
            timerEl.style.display = 'block';
            callStartTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
                const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const secs = (elapsed % 60).toString().padStart(2, '0');
                timerEl.textContent = `${mins}:${secs}`;
            }, 1000);
        }
        
        // Initialize call
        async function initCall() {
            const stream = await getLocalMedia();
            if (!stream) return;
            
            peerConnection = new RTCPeerConnection(configuration);
            
            // Add local stream tracks
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
            
            // Handle remote stream
            peerConnection.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                document.getElementById('waitingMessage').style.display = 'none';
                startTimer();
            };
            
            // Handle ICE candidates
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('webrtc_ice_candidate', {
                        target_user_id: receiverId,
                        candidate: event.candidate
                    });
                }
            };
            
            // Create and send offer
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('webrtc_offer', {
                target_user_id: receiverId,
                offer: offer
            });
        }
        
        // Handle WebRTC answer
        socket.on('webrtc_answer', async (data) => {
            if (peerConnection && data.caller_id == receiverId) {
                try {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                } catch (e) {
                    console.error('Error setting remote description:', e);
                }
            }
        });
        
        // Handle ICE candidates from remote
        socket.on('webrtc_ice_candidate', async (data) => {
            if (peerConnection && data.caller_id == receiverId) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                } catch (error) {
                    console.error('Error adding ICE candidate:', error);
                }
            }
        });
        
        // Handle incoming offer (receiver side)
        socket.on('webrtc_offer', async (data) => {
            if (!peerConnection) return;
            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('webrtc_answer', {
                    target_user_id: data.caller_id,
                    answer: answer
                });
            } catch (e) {
                console.error('Error handling offer:', e);
            }
        });
        
        // End call
        function endCall() {
            if (timerInterval) {
                clearInterval(timerInterval);
                callDuration = callStartTime ? Math.floor((Date.now() - callStartTime) / 1000) : 0;
            }
            
            // FIX: Only update status if we have a valid call_id
            if (callId) {
                fetch('/call/update_status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        call_id: callId,
                        status: 'ended',
                        duration: callDuration
                    })
                }).catch(e => console.log('Status update error:', e));
            }
            
            if (peerConnection) peerConnection.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            
            window.close();
        }
        
        // Toggle microphone
        document.getElementById('micBtn').addEventListener('click', () => {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                const btn = document.getElementById('micBtn');
                btn.classList.toggle('muted');
                btn.querySelector('i').className = audioTrack.enabled ? 'fas fa-microphone' : 'fas fa-microphone-slash';
            }
        });
        
        // Toggle video
        document.getElementById('videoBtn').addEventListener('click', () => {
            if (callType !== 'video' || !localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                const btn = document.getElementById('videoBtn');
                btn.classList.toggle('off');
                btn.querySelector('i').className = videoTrack.enabled ? 'fas fa-video' : 'fas fa-video-slash';
            }
        });
        
        document.getElementById('endCallBtn').addEventListener('click', endCall);
        
        // FIX: Use flag to prevent double-call on beforeunload
        let callEnded = false;
        window.addEventListener('beforeunload', () => {
            if (!callEnded) {
                callEnded = true;
                endCall();
            }
        });
        
        // Initialize
        initCall();
    </script>
</body>
</html>
